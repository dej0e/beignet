[project]
name = "beignet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dej0e", email = "dejoejohn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langchain-aws>=1.8.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.15",
    "python-dotenv>=1.2.4",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
beignet = "beignet.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# evals/ is a top-level package (not shipped in the wheel); tests import its matcher
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.35",
    "pytest>=9.1.1",
]
